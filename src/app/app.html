<div class="split-container">
    <div class="editor-column">
        <tiptap-editor [content]="defaultText" [extensionsConfig]="extensionsConfig"
            (onContentChange)="onContentChange($event)"></tiptap-editor>
    </div>
    <div class="preview-column">
        <div class="tiptap-editor">
            <div class="preview-paper">
                <div class="tiptap ProseMirror" [innerHTML]="htmlContent()"></div>
            </div>
        </div>
    </div>
</div>
